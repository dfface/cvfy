name: Build Preview Deployment
on:
  pull_request:
    types: [opened, synchronize]

# cancel in-progress runs on new commits to same PR (github.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-preview:
    # Pinned to 22.04 on purpose: ubuntu-latest is now 24.04 (glibc 2.39), which
    # triggers `munmap_chunk(): invalid pointer` / SIGABRT crashes in the native
    # modules used during prerendering (sharp / PWA asset generation). 22.04
    # avoids that toolchain mismatch. Keep in sync with gh-pages.yml.
    runs-on: ubuntu-22.04
    name: Build Preview Site and Upload Build Artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build dist folder
        run: npm run generate
        env:
          # Give the prerenderer more headroom so native allocations don't fail.
          NODE_OPTIONS: --max-old-space-size=4096

      # Uploads the build directory as a workflow artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: ./dist

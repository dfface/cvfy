name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Needed by peaceiris/actions-gh-pages to push to the gh-pages branch
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish static site
    # Pinned to 22.04 on purpose: ubuntu-latest is now 24.04 (glibc 2.39), which
    # triggers `munmap_chunk(): invalid pointer` / SIGABRT crashes in the native
    # modules used during prerendering (sharp / PWA asset generation) on some
    # builds. 22.04 avoids that toolchain mismatch.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          # GitHub Pages serves from https://<user>.github.io/<repo>/.
          # Cloudflare Pages serves from the domain root, so set the
          # NUXT_APP_BASE_URL repository variable to "/" for that target
          # (Settings → Secrets and variables → Actions → Variables).
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL || format('/{0}/', github.event.repository.name) }}
          NUXT_SITE_URL: ${{ vars.NUXT_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          NODE_ENV: production
          # Give the prerenderer more headroom so native allocations don't fail.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Locate build output
        id: output
        run: |
          if [ -d ".output/public" ]; then
            echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          else
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          fi

      # Jekyll ignores folders starting with "_" (_nuxt), so it must be disabled.
      - name: Disable Jekyll processing
        run: touch "${{ steps.output.outputs.dir }}/.nojekyll"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.output.outputs.dir }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
          # The branch only holds build artifacts, so replace its history each time.
          # Remove this line if you prefer to keep the previous deployments.
          force_orphan: true
